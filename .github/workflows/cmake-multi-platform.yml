name: Orbital CI (CMake Multi-Platform)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - os: ubuntu-latest
            compiler: mingw
            c_compiler: x86_64-w64-mingw32-gcc
            cpp_compiler: x86_64-w64-mingw32-g++
            build_type: Release
            target: windows

          # - os: windows-latest
          #   compiler: msvc-latest
          #   c_compiler: cl
          #   cpp_compiler: cl
          #   build_type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build directory
        id: paths
        shell: bash
        run: echo "build_dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Setup MSVC (Latest)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Required Dependencies
        shell: bash
        run: |
          # Unset VCPKG_ROOT to avoid the path mismatch warning
          unset VCPKG_ROOT
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
             # Update vcpkg to get the latest baseline commit
             cd "$VCPKG_INSTALLATION_ROOT" && git pull
             cd "$GITHUB_WORKSPACE"
             vcpkg install
          else
             sudo apt-get update
             sudo apt-get install -y libncurses5-dev libncursesw5-dev
          fi
        
      - name: Configure CMake
        shell: bash
        run: |
          # Unset VCPKG_ROOT to avoid the path mismatch warning
          unset VCPKG_ROOT
          if [ "${{ matrix.compiler }}" = "mingw" ]; then
            sudo apt-get update
            sudo apt-get install -y mingw-w64
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Update vcpkg to get the latest baseline commit
            cd "$VCPKG_INSTALLATION_ROOT" && git pull
            cd "$GITHUB_WORKSPACE"
            vcpkg install
          else
            sudo apt-get update
            sudo apt-get install -y libncurses5-dev libncursesw5-dev
          fi

      - name: Build
        run: cmake --build "${{ steps.paths.outputs.build_dir }}" --config ${{ matrix.build_type }}

      - name: Locate binary
        id: binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ] || [ "${{ matrix.compiler }}" = "mingw" ]; then
            echo "binary_path=${{ steps.paths.outputs.build_dir }}/src/${{ matrix.build_type }}/orbital.exe" >> "$GITHUB_OUTPUT"
          else
            echo "binary_path=${{ steps.paths.outputs.build_dir }}/src/orbital" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-${{ matrix.os }}-${{ matrix.compiler }}
          path: ${{ steps.binary.outputs.binary_path }}
