name: Orbital CI (CMake Multi-Platform)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - os: windows-latest
            compiler: msvc2019
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build directory
        id: paths
        shell: bash
        run: echo "build_dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      # Setup for MSVC 2019 (v142)
      - name: Setup MSVC 2019 (v142)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.2

      - name: Install Required Dependencies
        run: vcpkg install
        
      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # VS 2019 is "Visual Studio 16 2019"
            cmake -S . -B "${{ steps.paths.outputs.build_dir }}" \
                  -G "Visual Studio 16 2019" -A x64 \
                  -T v142 \
                  -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                  -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -S . -B "${{ steps.paths.outputs.build_dir }}" \
                  -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                  -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
                  -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          fi

      - name: Build
        run: cmake --build "${{ steps.paths.outputs.build_dir }}" --config ${{ matrix.build_type }}

      - name: Locate binary
        id: binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "binary_path=${{ steps.paths.outputs.build_dir }}/src/${{ matrix.build_type }}/orbital.exe" >> "$GITHUB_OUTPUT"
          else
            echo "binary_path=${{ steps.paths.outputs.build_dir }}/src/orbital" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-${{ matrix.os }}-${{ matrix.compiler }}
          path: ${{ steps.binary.outputs.binary_path }}
